<h2>Payment Checkout</h2><mat-card><form [formGroup]="form" (ngSubmit)="pay()"><app-form-input label="Amount" type="number" controlName="amount"></app-form-input><mat-form-field><mat-label>Payment Method</mat-label><mat-select formControlName="method"><mat-option value="UPI">UPI Payment</mat-option><mat-option value="NET_BANKING">Net Banking</mat-option></mat-select></mat-form-field><div *ngIf="form.value.method === 'UPI'"><mat-form-field><mat-label>UPI App</mat-label><mat-select formControlName="upiApp"><mat-option value="Google Pay">Google Pay</mat-option><mat-option value="PhonePe">PhonePe</mat-option></mat-select></mat-form-field><app-form-input label="UPI ID" controlName="upiId"></app-form-input><mat-card>{{ qrCode }}</mat-card></div><div *ngIf="form.value.method === 'NET_BANKING'"><mat-form-field><mat-label>Select Bank</mat-label><mat-select formControlName="bank"><mat-option value="SBI">SBI</mat-option><mat-option value="HDFC">HDFC</mat-option><mat-option value="ICICI">ICICI</mat-option></mat-select></mat-form-field></div><button mat-raised-button color="primary">Pay Now</button></form></mat-card>
