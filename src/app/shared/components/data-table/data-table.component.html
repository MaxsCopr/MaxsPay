<table mat-table [dataSource]="dataSource" class="mat-elevation-z1 w-100"><ng-container [matColumnDef]="column" *ngFor="let column of columns"><th mat-header-cell *matHeaderCellDef>{{ column | titlecase }}</th><td mat-cell *matCellDef="let row">{{ row[column] }}</td></ng-container><tr mat-header-row *matHeaderRowDef="columns"></tr><tr mat-row *matRowDef="let row; columns: columns"></tr></table>
